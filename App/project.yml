name: DuoUpdater
options:
  bundleIdPrefix: com.duoupdater
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Apple Silicon only, stated explicitly rather than inherited from whatever the
# build machine happens to be. This is a product decision, not a build detail:
# the vendor recipe registry pins arm64 endpoints and arm64 install assets
# throughout (VendorProbeRecipe's arm64 feed URLs, GitHubReleasesSource's
# `-aarch64`/`-arm64` asset patterns). A universal DuoUpdater would run on an
# Intel Mac and then hand that Mac arm64-only builds of every app it updates —
# the install would "succeed" and leave an app that cannot launch. Shipping
# arm64-only makes the machine that can't be served also the machine that can't
# run us. Do not widen this without giving the registry a second set of URLs.
settings:
  ARCHS: arm64

packages:
  DuoUpdaterCore:
    path: ../DuoUpdaterCore
  # The CLI's library half. Built here as well as by SwiftPM because the
  # shipping `duo` needs a Developer ID signature to hold its own App Management
  # grant — `swift build` produces an ad-hoc one, which cannot.
  duo:
    path: ../CLI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3

targets:
  # The first test target over `App/Sources`. Before it, those ~20k lines were
  # compiled and never executed: `make test` runs the two SwiftPM packages, and
  # the only thing that touched App code was `check_localizable_keys.py`, which
  # reads the compiler's string metadata without running anything. Four of the
  # thirteen defects found reviewing the channel-store change lived here, each
  # one compiling green.
  #
  # It deliberately compiles ONE app source file rather than `Sources`. Not
  # thrift: `AppListModel.swift` reaches `SettingsView`, which pulls in the whole
  # SwiftUI tree, and `AppListModel.init` registers for notifications, arms two
  # FSEvent streams, KVO-observes every running process and starts the periodic
  # check loop — a test bundle that constructs it is a test bundle that talks to
  # vendor endpoints. Widening this list is a decision, not a formality: what
  # goes in must be free of SwiftUI and of `AppListModel`, and the build breaking
  # when that stops being true is the point.
  #
  # Hostless (no TEST_HOST) so it needs no app bundle, no signing and no
  # `DEVELOPMENT_TEAM`. Driven by `scripts/app-tests.sh`, wired into `make test`.
  DuoUpdaterAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/ScanRowAssembly.swift
    dependencies:
      - package: DuoUpdaterCore
        product: DuoUpdaterCore
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        # Pinned like the four shipping targets (RowStateGallery, also a dev
        # tool, has none either). Without it the one app source file here
        # would compile under xcodebuild's default language mode while the app
        # target builds it under Swift 6 — so "the App tests pass" would stop
        # being evidence that the file builds the way the app builds it.
        SWIFT_VERSION: "6.0"

  # A developer tool, not part of the shipped app: renders every `RowActionState`
  # to `verify/row-states/*.png` so a change to how a row is drawn shows up as an
  # image diff. It exists because there is no test target over `App/Sources` (see
  # below), so nothing else executes the row rendering — and the failure that
  # created the need was a state drawing NOTHING, which no assertion about the
  # state itself can catch. Run with `make gallery`.
  #
  # The sources it links are deliberately free of `AppListModel`: the views take a
  # state plus plain closures, so the gallery needs no scanning, no network and no
  # notification permission to draw them.
  RowStateGallery:
    type: tool
    platform: macOS
    sources:
      - RowStateGallery
      - path: Sources/RowActionViews.swift
      - path: Sources/AppIconCache.swift
      - path: Sources/PopoverRowAction.swift
    dependencies:
      - package: DuoUpdaterCore

  DuoUpdater:
    type: application
    platform: macOS
    sources:
      - Sources
      - Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: DuoUpdaterCore
        product: DuoUpdaterCore
      - package: Sparkle
        product: Sparkle
      # Build the privileged helper first (ordering); the executable + LaunchDaemon
      # plist are embedded and signed by the post-build script below.
      - target: DuoUpdaterHelper
        embed: false
    # Embed the helper executable into Contents/MacOS/ and the LaunchDaemon plist
    # into Contents/Library/LaunchDaemons/, then re-sign both the helper and the
    # whole app. A POST-BUILD script (after Copy Resources) that signs explicitly,
    # because /tmp/duo-dd is reused across builds and Xcode's implicit final sign
    # can be skipped on an incremental build, leaving these outside the seal.
    # Mirrors the hardened-runtime, identifier-based signing the app & Sparkle
    # helpers use. install.sh re-seals once more afterwards — harmless.
    postBuildScripts:
      - name: Embed + sign privileged helper and LaunchDaemon plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="$CODESIGNING_FOLDER_PATH"
          mkdir -p "$APP/Contents/Library/LaunchDaemons" "$APP/Contents/MacOS"
          cp "$SRCROOT/Helper/com.duoupdater.helper.plist" \
             "$APP/Contents/Library/LaunchDaemons/com.duoupdater.helper.plist"
          cp "$BUILT_PRODUCTS_DIR/DuoUpdaterHelper" "$APP/Contents/MacOS/DuoUpdaterHelper"
          # Sparkle's own BinaryDelta, the only reader of its patch format (see
          # DeltaApplier). It ships in the Sparkle package's artifact bundle rather
          # than as a build product, so it is located rather than referenced by a
          # fixed path — the artifact directory is under whatever DerivedData this
          # build is using.
          #
          # A missing tool FAILS THE BUILD instead of warning. The alternative is a
          # product that looks fine and silently takes the full download for every
          # update — precisely the class of "builds clean, quietly does less" defect
          # the empty-.lproj incremental-build bug already cost us once.
          DD="${BUILD_DIR%/Build/Products}"
          BINARY_DELTA="$(find "$DD/SourcePackages/artifacts" -type f -name BinaryDelta -perm +111 2>/dev/null | head -1)"
          if [ -z "$BINARY_DELTA" ]; then
            echo "error: Sparkle's BinaryDelta not found under $DD/SourcePackages/artifacts —" >&2
            echo "error: resolve package dependencies and rebuild." >&2
            exit 1
          fi
          cp "$BINARY_DELTA" "$APP/Contents/MacOS/BinaryDelta"
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$EXPANDED_CODE_SIGN_IDENTITY" != "-" ]; then
            rt=""
            [ "$CONFIGURATION" = "Release" ] && rt="--options runtime"
            codesign --force $rt --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$APP/Contents/MacOS/DuoUpdaterHelper"
            # Signed with the app's own identity: it arrives unsigned from the
            # artifact bundle (TeamIdentifier=not set), and an unsigned executable
            # inside a hardened-runtime bundle is refused by notarization.
            codesign --force $rt --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$APP/Contents/MacOS/BinaryDelta"
            codesign --force $rt --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$APP"
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.duoupdater.app
        MARKETING_VERSION: "0.3.82"
        CURRENT_PROJECT_VERSION: "91"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        # Menu-bar-only app: no Dock icon, no main window.
        SWIFT_VERSION: "6.0"
        # Sign with a STABLE identity, not ad-hoc ("-"). macOS keys TCC grants
        # (App Management, Automation…) to the app's code identity; an ad-hoc
        # signature changes its CDHash on every rebuild, so a granted permission
        # is invalidated each build and "Quit & Reopen" can relaunch a different
        # identity. A Developer ID gives a stable, team-based designated
        # requirement, so grants persist across rebuilds — no provisioning
        # profile needed for a local tool.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: ${DUO_TEAM_ID}
        # Build a single real binary, not the Xcode 16 "debug dylib" (a tiny stub
        # launcher + DuoUpdater.debug.dylib). With the stub, `AXIsProcessTrusted()`
        # evaluates the launcher's identity and returns false even when the app IS
        # in the Accessibility list — so the AX-driven incremental App Store update
        # can never see its grant. (App Management is unaffected: it trips on a
        # filesystem EPERM, not an AX trust check.) Off → Accessibility works.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          # Required for notarization. The app is not sandboxed and does not need
          # any special hardened-runtime exceptions for its current behavior.
          ENABLE_HARDENED_RUNTIME: YES
          # Apple notarization requires a secure signing timestamp on the
          # Developer ID signature, not just a local "Signed Time".
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Xcode's injected base entitlements include `get-task-allow`, which is
          # fine for local development but invalid for notarized distribution.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # Privileged helper: a root LaunchDaemon (registered via SMAppService.daemon)
  # that runs `mas install` over XPC — so App Store updates need a password only
  # once (the one-time Login-Items approval), never per install. Same Developer ID
  # team as the app, which both XPC peers pin to. The post-build script above
  # embeds + re-signs it into the app bundle.
  # Phase-0 experiment, not shipped. A standalone Developer ID-signed executable
  # whose only job is to report whether it can hold its own App Management grant
  # — the answer decides how much of `duo install` can exist outside the app
  # bundle. Settings cloned from DuoUpdaterHelper because that is the working
  # recipe in this repo for a signed, non-bundled Mach-O; `swift build` produces
  # an ad-hoc signature, which cannot hold a TCC grant across rebuilds at all.
  duo-tcc-spike:
    type: tool
    platform: macOS
    sources:
      - Spike
    dependencies:
      - package: DuoUpdaterCore
        product: DuoUpdaterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoupdater.tcc-spike
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: ${DUO_TEAM_ID}

  # The shipping `duo` binary. Same settings as the helper and the spike: a
  # Developer ID signature with an identity-based designated requirement, which
  # is what lets a TCC grant survive a rebuild. Not built by `make install` —
  # `make cli` builds and deploys it, because its App Management grant is bound
  # to its install path as well as its identity.
  duo-cli:
    type: tool
    platform: macOS
    sources:
      - path: ../CLI/Sources/duo
    dependencies:
      - package: duo
        product: DuoKit
    settings:
      base:
        # The product filename is the target name, so the deployed binary is
        # renamed to `duo` by scripts/build-cli.sh. A target literally named
        # `duo` would collide with the package of that name.
        PRODUCT_BUNDLE_IDENTIFIER: com.duoupdater.cli
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: ${DUO_TEAM_ID}
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options runtime"

  DuoUpdaterHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        # The daemon plist is embedded by the app's build script, not compiled.
        excludes:
          - "com.duoupdater.helper.plist"
      - Shared
    settings:
      base:
        # Executable filename is the target name (DuoUpdaterHelper) — the daemon
        # plist's BundleProgram points at Contents/MacOS/DuoUpdaterHelper. The bundle
        # *identifier* (for signing / XPC pinning) is com.duoupdater.helper.
        PRODUCT_BUNDLE_IDENTIFIER: com.duoupdater.helper
        MARKETING_VERSION: "0.3.82"
        CURRENT_PROJECT_VERSION: "91"
        SWIFT_VERSION: "6.0"
        # Embed a generated Info.plist into the binary's __TEXT,__info_plist so the
        # helper has a bundle id/version (Bundle.main reads it) without a wrapper.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: ${DUO_TEAM_ID}
        # `audit_token_to_euid/egid` live in libbsm. The helper uses them to bind
        # every privileged request to the kernel-authenticated XPC peer identity.
        OTHER_LDFLAGS: "-lbsm"
      configs:
        Release:
          # Match the app: hardened runtime for notarization. The post-build script
          # re-signs with --options runtime too, so the final nested signature is
          # hardened regardless.
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

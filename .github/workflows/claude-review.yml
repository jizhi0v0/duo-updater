# Automatic Claude review on the maintainer's own pull requests.
#
# Every run is a fresh reviewer with no context from the session that wrote the
# pull request. What carries over between rounds is the PR itself: each review is
# posted as a comment ending in a `claude-review:v1` marker with the reviewed head
# SHA, and the author answers it in a comment. prepare.sh reads those back:
#
#   • no earlier review          → full review of the PR's own diff
#   • earlier review, new commits → recheck: only the first-parent, non-merge
#                                   commits since the reviewed SHA, plus the
#                                   previous findings and the author's verdicts.
#                                   Verdicts are read from the author's plain
#                                   pull request comments posted after that
#                                   review; a review body is not read back.
#   • nothing new (re-run, ready_for_review on the same SHA, a base-branch
#     merge only)                 → skip
#
# This is the first workflow here that uses a secret, so it is fenced three ways:
#
#   • The job only runs when the PR author is the maintainer and the head branch
#     lives in this repository. Fork PRs never reach the action.
#   • `pull_request`, never `pull_request_target`: GitHub withholds secrets from
#     workflows triggered by a fork, so even a mistake in the `if:` leaks nothing.
#   • claude-code-action refuses actors without write access and all bots by
#     default. `allowed_non_write_users` / `allowed_bots` are deliberately unset.
#   • Two jobs, split by what each may hold. `review` runs the model with a
#     READ-ONLY token (contents, pull requests): the reviewer reads vendors'
#     GitHub repositories through it, and that vendor text is the input an
#     attacker would write, so its token cannot post, push or approve. It ends
#     by uploading review.md. `post` holds `pull-requests: write`, runs no
#     model, and only posts that file. The checkout keeps no credential
#     (`persist-credentials: false`).
#   • review.md is the one way out of `review`, and it is posted verbatim, so
#     the reviewer is confined to the checkout:
#       – reads: no bare Read/Glob/Grep rule. Default mode then refuses reads
#         outside the working directory, by the file tools and by cat/grep/head
#         alike, so a steered reviewer cannot read /proc/self/environ (the
#         model's token). Not blockReadsOutsideWorkingDirectories: it also
#         refuses gh-get calls whose jq filter looks like a path.
#       – writes: review.md only (`Edit(//<workspace>/.claude-review/review.md)`).
#         Absolute (`//`): a `./` rule is relative to the CURRENT directory, so
#         after the reviewer `cd`s into a subdirectory it no longer matches and
#         the write is refused. That failed #1301's round 3 and 2 of 7 replays
#         in bench/onboarding (https://code.claude.com/docs/en/permissions,
#         "Read and Edit");
#       – git: no `Bash(git …:*)` prefix rule. Claude Code's built-in read-only
#         classification runs diff/log/show and refuses `--output=<file>`, which
#         writes anywhere (e.g. git config, then `git diff` runs a command). A
#         prefix rule let `--out''put=` through; the classifier parses the quotes.
#     `post` also refuses a review that contains anything shaped like a token.
#
# The reviewer reads REVIEW.md, the checkout and the PR description, runs
# read-only git, reads the GitHub REST API through `.github/claude-review/gh-get`
# (GET under repos/<owner>/<repo> only, jq in an empty environment so no filter
# can print the token), and writes its review file.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The recipe sweep on the mini opens one of these every few hours from a
    # `verify/baseline-<stamp>` branch, under the maintainer's own account, and
    # the whole diff is verify/baseline.json — machine state, regenerated, with
    # nothing for a reviewer to say. Skipped at the job level so no runner and
    # no model time is spent on them at all. `verify/install-<stamp>` is the same
    # for install-verify.yml (verify/identities.json, verify/install-baseline.json),
    # opened with the maintainer's token so its CI runs. `recipe-autofix/` is
    # recipe-autofix.yml's: what a reviewer here could judge, its gates already
    # checked, and what they cannot (the vendor's page) this job cannot fetch;
    # a second model that reads the page decides there instead.
    # `bench/` is a run of the onboarding benchmark (bench/onboarding/): result
    # files written by its harness, measured, not authored. A change to the
    # harness itself goes on any other branch and is reviewed as usual.
    # `appcast/` is publish-release.sh publishing a release that is already out:
    # appcast.xml regenerated by Sparkle's generate_appcast, its release notes the
    # CHANGELOG section reviewed in the release PR. The script refuses a run that
    # changes an already-published entry's signature or URL; the new entry's
    # EdDSA signature is generate_appcast's, which a reviewer here cannot check
    # either. And the PR auto-merges on `test` alone, so a review would only land
    # after the feed is live.
    # `triggering_actor` is who caused this run (a push, a re-run), which can be
    # someone else than the PR's author once the repository has another
    # collaborator with write access; only the maintainer's actions reach the
    # model token.
    if: >-
      github.triggering_actor == 'jizhi0v0' &&
      github.event.pull_request.user.login == 'jizhi0v0' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'verify/baseline-') &&
      !startsWith(github.event.pull_request.head.ref, 'verify/install-') &&
      !startsWith(github.event.pull_request.head.ref, 'recipe-autofix/') &&
      !startsWith(github.event.pull_request.head.ref, 'bench/') &&
      !startsWith(github.event.pull_request.head.ref, 'appcast/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.prep.outputs.mode }}
      round: ${{ steps.prep.outputs.round }}
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      WORK: ${{ github.workspace }}/.claude-review
    steps:
      # The default pull_request checkout is the synthetic merge commit; the
      # markers record head SHAs, so check out the head itself, with history.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide full review, recheck or skip
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/claude-review/prepare.sh

      - name: Review
        if: steps.prep.outputs.mode != 'skip'
        # A release at or after 9ca9355 (main, 2026-09-22), the first commit that
        # installs Claude Code 2.1.280, the minimum for claude-opus-5-5
        # (v1.0.231 still installs 2.1.278). Don't go below it.
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        # Subagents in the foreground. On #949 the reviewer split the work across
        # three Agent calls, which ran in the background, and ended its turn: no
        # review.md, three runs in a row (the run Summary's report showed it; the
        # log does not). The CLI itself would wait for them — a background task
        # makes a headless session emit an interim `result`, then the real one —
        # but this action's SDK runner stops at the first `result`
        # (anthropics/claude-code-action#1499, #1852, since v1.0.146). This switch
        # is the workaround verified there: every subagent blocks until it returns,
        # even when the model asks for the background
        # (https://code.claude.com/docs/en/sub-agents.md). Drop it once the action
        # waits for the final result.
        # GH_TOKEN is this job's read-only token, for gh-get.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          # Put the reviewer's tool calls in the run Summary. Input is trusted
          # here (the maintainer's own PRs only), which is the action's condition.
          display_report: "true"
          # The reviewer's model is the repository variable CLAUDE_REVIEW_MODEL
          # (Settings → Secrets and variables → Actions → Variables), so it can
          # change without a pull request. Unset means the action's default.
          # Effort is set explicitly: claude-opus-5-5 defaults to medium. Authoring
          # runs at medium or high, and the reviewer sits above both. xhigh over
          # high, measured on seven onboardings (bench/onboarding/results/
          # review-replay.yml): 2 of 4 expected problems caught against 1 (it saw
          # that one-click turns a recorded nightly gap into a downgrade), one more
          # true finding, no false positives, about twice the cost and time
          # ($2.5 and 6 min a review).
          claude_args: >-
            ${{ vars.CLAUDE_REVIEW_MODEL && format('--model {0}', vars.CLAUDE_REVIEW_MODEL) || '' }}
            --effort xhigh
            --allowedTools "Edit(/${{ github.workspace }}/.claude-review/review.md),Bash(${{ github.workspace }}/.github/claude-review/gh-get *)"

      - name: Check the review was written
        if: steps.prep.outputs.mode != 'skip'
        run: |
          if [ ! -s "$WORK/review.md" ]; then
            echo "::error::The reviewer finished without writing $WORK/review.md"
            exit 1
          fi

      # Copied out of .claude-review/ first: upload-artifact skips hidden paths.
      - name: Stage the review
        if: steps.prep.outputs.mode != 'skip'
        run: |
          mkdir -p "$RUNNER_TEMP/claude-review"
          cp "$WORK/review.md" "$RUNNER_TEMP/claude-review/review.md"
      - name: Upload the review
        if: steps.prep.outputs.mode != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review
          path: ${{ runner.temp }}/claude-review/review.md
          retention-days: 7
          if-no-files-found: error

  post:
    needs: review
    if: needs.review.outputs.mode != '' && needs.review.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MODE: ${{ needs.review.outputs.mode }}
      ROUND: ${{ needs.review.outputs.round }}
    steps:
      - name: Download the review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-review
          path: ${{ runner.temp }}/claude-review

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          review="$RUNNER_TEMP/claude-review/review.md"
          if [ ! -s "$review" ]; then
            echo "::error::The review artifact has no review.md"
            exit 1
          fi
          # A backstop, not the boundary (that is the reviewer's confinement):
          # never post text shaped like an Anthropic or GitHub token.
          if grep -Eq 'sk-ant-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}' "$review"; then
            echo "::error::The review contains a token-shaped string; not posting it"
            exit 1
          fi
          {
            echo "### Claude review · round $ROUND ($MODE) · \`${HEAD_SHA:0:7}\`"
            echo
            cat "$review"
            echo
            echo "<!-- claude-review:v1 sha=$HEAD_SHA round=$ROUND -->"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"

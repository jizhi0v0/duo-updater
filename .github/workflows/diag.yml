name: diag-early-boot-disk-images
on:
  push:
    branches: [diag/early-boot-disk-images]
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        arm: [nocompile, relink, execfirst, diskfirst]
        rep: [1, 2]
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Uptime at job start
        run: echo "uptime=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"; uptime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name SwiftPM's build cache
        id: spm-key
        run: echo "key=spm-release-$({ xcodebuild -version; swift --version; } 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM's build
        id: spm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-none
          restore-keys: ${{ steps.spm-key.outputs.key }}-
      - name: Put back the cached build's file times
        if: steps.spm-cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci_build_cache.py restore DuoUpdaterCore/.build
      - name: Relink the test product only (relink arm)
        if: matrix.arm == 'relink'
        run: |
          ls -la DuoUpdaterCore/.build/arm64-apple-macosx/release/ | grep -i xctest
          rm -rf DuoUpdaterCore/.build/arm64-apple-macosx/release/*.xctest
      - name: Exec the test binary once (execfirst arm)
        if: matrix.arm == 'execfirst'
        run: time swift test --package-path DuoUpdaterCore -c release --build-system native --filter NoSuchTestDiagXYZ || true
      - name: Disk-image warm-up (diskfirst arm)
        if: matrix.arm == 'diskfirst'
        run: |
          set +e
          bash diag/probe.sh 30
          grep -h ' rc=[1-9]' "$RUNNER_TEMP"/probe-*.log | head; cat "$RUNNER_TEMP"/probe-*.log | wc -l
      - name: Core tests (Release)
        run: |
          set +e
          echo "uptime at test start=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"
          ( while true; do echo "--- $(date -u +%H:%M:%S)"; top -l 2 -n 5 -o cpu -stats pid,command,cpu | tail -6; sleep 20; done ) > "$RUNNER_TEMP/cpu.log" 2>&1 &
          scripts/run-with-hang-report.sh 1200 make test-release
          echo "rc=$?"
          echo "uptime at test end=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"
      - name: CPU
        if: always()
        run: cat "$RUNNER_TEMP/cpu.log" | head -120

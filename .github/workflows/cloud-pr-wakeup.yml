# No PR checkout, downloaded artifact or model runs with this write token.
# workflow_run uses default-branch code and only publishes completion metadata.
name: Cloud PR wakeup

on:
  workflow_run:
    workflows: [CI, Codex review gate]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: cloud-pr-wakeup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event.workflow_run.name == 'Codex review gate' &&
       github.event.workflow_run.event == 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/notify_cloud_pr.py
            scripts/check_codex_review.py
          sparse-checkout-cone-mode: false
      - name: Publish completion metadata for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/notify_cloud_pr.py --run "$RUN_ID"

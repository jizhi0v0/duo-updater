name: DuoUpdater
options:
  bundleIdPrefix: com.duoupdater
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  DuoUpdaterCore:
    path: ../DuoUpdaterCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3

targets:
  DuoUpdater:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: DuoUpdaterCore
        product: DuoUpdaterCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.duoupdater.app
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        # Menu-bar-only app: no Dock icon, no main window.
        SWIFT_VERSION: "6.0"
        # Sign with a STABLE identity, not ad-hoc ("-"). macOS keys TCC grants
        # (App Management, Automation…) to the app's code identity; an ad-hoc
        # signature changes its CDHash on every rebuild, so a granted permission
        # is invalidated each build and "Quit & Reopen" can relaunch a different
        # identity. A Developer ID gives a stable, team-based designated
        # requirement, so grants persist across rebuilds — no provisioning
        # profile needed for a local tool.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: RS59HDH7Y3
        # Build a single real binary, not the Xcode 16 "debug dylib" (a tiny stub
        # launcher + DuoUpdater.debug.dylib). With the stub, `AXIsProcessTrusted()`
        # evaluates the launcher's identity and returns false even when the app IS
        # in the Accessibility list — so the AX-driven incremental App Store update
        # can never see its grant. (App Management is unaffected: it trips on a
        # filesystem EPERM, not an AX trust check.) Off → Accessibility works.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          # Required for notarization. The app is not sandboxed and does not need
          # any special hardened-runtime exceptions for its current behavior.
          ENABLE_HARDENED_RUNTIME: YES
          # Apple notarization requires a secure signing timestamp on the
          # Developer ID signature, not just a local "Signed Time".
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Xcode's injected base entitlements include `get-task-allow`, which is
          # fine for local development but invalid for notarized distribution.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

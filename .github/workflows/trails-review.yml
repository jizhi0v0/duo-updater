# Label a "changelog trails the detected version" issue `vendor-lag` when the
# vendor just hasn't published the notes yet. scripts/trails_review.py says how:
# the recipe's page is fetched and searched for the release, and only when it has
# none does Haiku look for the notes elsewhere. Nothing is closed or silenced; the
# nightly sweep on the mini still closes the issue once the notes appear.
#
# Runs when an issue is opened or reopened with `recipe-broken` already on it,
# which is how the sweep files (`gh issue create --label`). Anyone can open an
# issue titled like one, but only a collaborator can label it at creation, so the
# label is the gate on spending the token. The title and body only ever reach the
# script through `gh`, never through an expression in `run:`.
#
# The Haiku step uses CLAUDE_CODE_OAUTH_TOKEN, as sunset-sweep.yml does, with
# WebSearch and WebFetch only and no GitHub token in its environment.
#
# Otherwise ci.yml's rules: hosted runner, actions pinned by SHA.
name: Trails review

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        type: number
        required: true
      dry_run:
        description: "Print the comment, change nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: trails-review-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'recipe-broken') &&
       contains(github.event.issue.title, 'trails the detected version'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/trails_review.py
            DuoUpdaterCore/Sources/DuoUpdaterCore/Recipes
          sparse-checkout-cone-mode: false

      # The version sunset-sweep.yml pins.
      - name: Install Claude Code
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.287
          claude --version

      - name: Label
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create vendor-lag --repo "$GITHUB_REPOSITORY" --force \
            --color fef2c0 --description "The vendor hasn't published these notes yet; the recipe is fine"

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          args=("$ISSUE")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/trails_review.py "${args[@]}"

# Automatic Claude review on the maintainer's own pull requests.
#
# Every run is a fresh reviewer with no context from the session that wrote the
# pull request. What carries over between rounds is the PR itself: each review is
# posted as a comment ending in a `claude-review:v1` marker with the reviewed head
# SHA, and the author answers it in a comment. prepare.sh reads those back:
#
#   • no earlier review          → full review of the PR's own diff
#   • earlier review, new commits → recheck: only the first-parent, non-merge
#                                   commits since the reviewed SHA, plus the
#                                   previous findings and the author's verdicts.
#                                   Verdicts are read from the author's plain
#                                   pull request comments posted after that
#                                   review; a review body is not read back.
#   • nothing new (re-run, ready_for_review on the same SHA, a base-branch
#     merge only)                 → skip
#
# This is the first workflow here that uses a secret, so it is fenced three ways:
#
#   • The job only runs when the PR author is the maintainer and the head branch
#     lives in this repository. Fork PRs never reach the action.
#   • `pull_request`, never `pull_request_target`: GitHub withholds secrets from
#     workflows triggered by a fork, so even a mistake in the `if:` leaks nothing.
#   • claude-code-action refuses actors without write access and all bots by
#     default. `allowed_non_write_users` / `allowed_bots` are deliberately unset.
#   • `GH_TOKEN` is set on the two steps that shell out to `gh`, not on the job,
#     so it is absent from the reviewer step's environment. The action gets its
#     own `github_token` input; nothing else here needs the token, and the
#     checkout deliberately keeps no credential (`persist-credentials: false`).
#
# The reviewer reads REVIEW.md, the checkout and the PR description, runs
# read-only git, and writes its review file. Posting is done by the last step,
# not by the model.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The recipe sweep on the mini opens one of these every few hours from a
    # `verify/baseline-<stamp>` branch, under the maintainer's own account, and
    # the whole diff is verify/baseline.json — machine state, regenerated, with
    # nothing for a reviewer to say. Skipped at the job level so no runner and
    # no model time is spent on them at all.
    if: >-
      github.event.pull_request.user.login == 'jizhi0v0' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'verify/baseline-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      WORK: ${{ github.workspace }}/.claude-review
    steps:
      # The default pull_request checkout is the synthetic merge commit; the
      # markers record head SHAs, so check out the head itself, with history.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide full review, recheck or skip
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/claude-review/prepare.sh

      - name: Review
        if: steps.prep.outputs.mode != 'skip'
        # A release at or after 9ca9355 (main, 2026-09-22), the first commit that
        # installs Claude Code 2.1.280, the minimum for claude-opus-5-5
        # (v1.0.231 still installs 2.1.278). Don't go below it.
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        # Subagents in the foreground. On #949 the reviewer split the work across
        # three Agent calls, which ran in the background, and ended its turn: no
        # review.md, three runs in a row (the run Summary's report showed it; the
        # log does not). The CLI itself would wait for them — a background task
        # makes a headless session emit an interim `result`, then the real one —
        # but this action's SDK runner stops at the first `result`
        # (anthropics/claude-code-action#1499, #1852, since v1.0.146). This switch
        # is the workaround verified there: every subagent blocks until it returns,
        # even when the model asks for the background
        # (https://code.claude.com/docs/en/sub-agents.md). Drop it once the action
        # waits for the final result.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          # Put the reviewer's tool calls in the run Summary. Input is trusted
          # here (the maintainer's own PRs only), which is the action's condition.
          display_report: "true"
          # The reviewer's model is the repository variable CLAUDE_REVIEW_MODEL
          # (Settings → Secrets and variables → Actions → Variables), so it can
          # change without a pull request. Unset means the action's default.
          # Effort is set explicitly: claude-opus-5-5 defaults to medium, which is
          # what day-to-day authoring runs at, and the reviewer sits one above it.
          claude_args: >-
            ${{ vars.CLAUDE_REVIEW_MODEL && format('--model {0}', vars.CLAUDE_REVIEW_MODEL) || '' }}
            --effort high
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      - name: Post the review
        if: steps.prep.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.prep.outputs.mode }}
          ROUND: ${{ steps.prep.outputs.round }}
        run: |
          if [ ! -s "$WORK/review.md" ]; then
            echo "::error::The reviewer finished without writing $WORK/review.md"
            exit 1
          fi
          {
            echo "### Claude review · round $ROUND ($MODE) · \`${HEAD_SHA:0:7}\`"
            echo
            cat "$WORK/review.md"
            echo
            echo "<!-- claude-review:v1 sha=$HEAD_SHA round=$ROUND -->"
          } > "$WORK/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$WORK/comment.md"

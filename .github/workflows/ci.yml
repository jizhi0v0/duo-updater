# Build and test on a GitHub-hosted Mac.
#
# The last workflow this repository had was deleted the day it went public
# (4ff9a90, 2026-08-14) because it pointed at a self-hosted runner running as the
# desktop user, and a public repo eventually gets a pull_request trigger pointed at
# it. That reasoning still stands, so this one is built the other way round:
#
#   • GitHub-hosted runner only. Nothing here can reach a machine of ours.
#   • No secrets. `make test` needs none — both xcodebuild invocations already pass
#     CODE_SIGNING_ALLOWED=NO, and DUO_TEAM_ID has a default — so a fork's pull
#     request has nothing to exfiltrate even if it rewrites this file.
#   • `pull_request`, never `pull_request_target`. The latter runs the BASE
#     workflow with the repository's secrets available to a fork's code, which is
#     the standard way this goes wrong.
#   • Actions pinned by commit SHA, not by tag. A tag can be moved.
#
# Standard GitHub-hosted runners are free and unlimited on public repositories, and
# xcode-27 is an arm64 M1 — which matters here because DuoUpdater is arm64-only
# by product decision (App/project.yml, ARCHS: arm64), so this builds and tests
# natively rather than under emulation.
#
# There is no `macos-27` label: GitHub's only macOS 27 image is `xcode-27` (macOS 27
# + Xcode 27, same 3-core M1 tier as macos-latest). NOT `xcode-27-xlarge` — larger
# runners are billed even on public repositories.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. The release path deliberately does not live in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    # `make test` reaches vendor endpoints (the install gates download real
    # packages and verify sha512 + Team ID), so it is slower and less predictable
    # than a pure unit run. Generous, but far under the 6h job ceiling.
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # App/DuoUpdater.xcodeproj is gitignored — the spec in App/project.yml is the
      # source of truth and scripts/app-tests.sh regenerates it when missing.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      - name: make test
        # DUO_DOWNLOAD_GATE moves the one test that fetches real vendor builds off
        # a metered connection onto this runner, where egress is free. Measured on
        # the author's Mac: `make test` goes from ~185 MB to ~25 MB.
        #
        # It was switched on once before and wedged three runs out of three — the
        # test process stopped emitting entirely, for 46 and 16 minutes, until a
        # watchdog caught the third at four. `sample(1)` found all three
        # cooperative-pool threads (this runner is 3-core, so that is the whole
        # pool) blocked in `SecStaticCodeCheckValidity` -> `Dispatch::Group::wait()`,
        # and two samples a minute apart showed 0.01s of CPU between them: blocked,
        # not slow. #351. The gates now run off that pool, which is what makes this
        # safe to turn on.
        #
        # If it wedges again, `scripts/run-with-hang-report.sh` bounds it at 30
        # minutes and prints the stacks rather than leaving another silent hour.
        # Through the wrapper, so a wedge costs 30 minutes and a set of thread
        # stacks instead of 60 minutes of silence. Measured: three runs on this
        # branch wedged, one of them for the full job budget with no output at
        # all. See #351 and scripts/run-with-hang-report.sh for why this is out
        # here and not a watchdog inside the test process.
        env:
          DUO_DOWNLOAD_GATE: "1"
        run: scripts/run-with-hang-report.sh 1800 make test

      # scripts/app-tests.sh prints only an excerpt and leaves the full xcodebuild
      # output in the derived-data dir, which dies with the runner. Two first
      # attempts on 2026-09-16 failed there and could not be diagnosed after the
      # retry went green: the name-set gate reporting one case never ran (run
      # 35084900798), and `Could not resolve package dependencies:` with its
      # reasons only in that file (run 35085768264).
      #
      # Globbed because the dir is per checkout (/tmp/duo-app-tests-<hash8>) and
      # the log per process (app-tests-<pid>.log). Each hosted job gets a fresh
      # VM, so only this job's dir can match. The rest of that dir is build
      # products and caches (~500 MB on a local Mac, 2026-09-16).
      #
      # Not the .xcresult itself: on a failed run it embeds a system .logarchive,
      # and uploading the bundle as-is made a 107 MB artifact (run 35087278533,
      # two 184 MB dyld-cache text files in it). What is worth keeping from it is
      # extracted below: the per-case results, which answer "did that case run"
      # without going through the console log the gate parses, and xctest's own
      # session logs.
      #
      # Bounded because it runs before the upload: after a wedge the bundle may be
      # half-written, and if reading it stalled into the job's 60-minute limit
      # the upload would depend on how `failure()` evaluates after a job timeout,
      # which GitHub's expression docs don't define (third-party reports say the
      # job ends cancelled, which would skip it). Not measured here.
      - name: Extract app-tests result bundle
        if: failure()
        timeout-minutes: 5
        run: |
          shopt -s nullglob
          for bundle in /tmp/duo-app-tests-*/Logs/Test/*.xcresult; do
            out="${bundle%/Logs/Test/*}/ci-xcresult/$(basename "$bundle" .xcresult)"
            mkdir -p "$out"
            xcrun xcresulttool get test-results tests --path "$bundle" > "$out/tests.json" \
              || echo "::warning::xcresulttool could not read test results from $bundle"
            xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$out/diagnostics" >/dev/null \
              || echo "::warning::xcresulttool could not export diagnostics from $bundle"
            find "$out/diagnostics" -name '*.logarchive' -prune -exec rm -rf {} + 2>/dev/null || true
          done

      # `failure()` also fires when something other than the app tests failed;
      # then nothing matches and this only warns. Artifact names must be unique
      # within a run; the attempt number keeps a failing re-run from depending on
      # whether an earlier attempt's artifact counts against that.
      - name: Upload app-tests logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-tests-logs-attempt-${{ github.run_attempt }}
          path: |
            /tmp/duo-app-tests-*/app-tests-*.log
            /tmp/duo-app-tests-*/ci-xcresult/
            /tmp/duo-app-tests-*/Logs/Package/*.xcactivitylog


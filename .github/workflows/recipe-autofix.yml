# Draft pull requests for broken changelog recipes (`duo autofix`).
#
# The recipe sweep on the mini files a `recipe-broken` issue; when that issue is a
# changelog recipe whose entries vanished or collapsed, this asks Claude for new
# values, runs every gate, and opens a DRAFT pull request that says `Refs #N`.
# A second model checks what the gates cannot; when it confirms everything, and
# only while the repository variable RECIPE_AUTOFIX_AUTOMERGE is 1, the last step
# marks the draft ready and turns on auto-merge. CLI/Sources/DuoKit/ChangelogAutofix.swift
# has the gates, the check, and why the scope is this narrow.
#
# Three jobs, split by what each may hold:
#
#   • select (ubuntu): reads the issue and decides whether there is anything to do,
#     so most `recipe-broken` issues never start a Mac.
#   • propose (hosted macOS): holds the model's token and a READ-ONLY GITHUB_TOKEN,
#     and no write credential. It reads a vendor's web page and runs the gates, so
#     it is the job an attacker's page would have to work through; there is
#     nothing in it worth having. It ends by uploading the change as a patch.
#   • publish (ubuntu): holds the pull-request token. It runs no model and no
#     tests: it applies the patch to the commit propose started from, checks the
#     paths again, pushes `recipe-autofix/issue-<N>`, opens the draft, and merges
#     it only as above.
#
# The branch and the pull request use RECIPE_AUTOFIX_PR_TOKEN, a fine-grained
# token for this repository (Contents + Pull requests write). A pull request
# GITHUB_TOKEN opens gets its CI runs only in an approval-required state (GitHub's
# "GITHUB_TOKEN" docs, checked 2026-10-11), so every draft would wait on a click.
# Its branch runs CI on a hosted runner (scripts/ci_route.py).
#
# One attempt per break comes from the trigger: an issue is opened once per
# break and reopened once per relapse, and any pull request already opened for
# the issue stops the attempt (`existingPullRequestRefusal`). So no run may be
# dropped, and GitHub cancels a run waiting in a concurrency group when another
# queues behind it. The group is therefore per issue: a run can only ever be
# replaced by a later one for the same issue, never by another issue's. Two
# in-scope issues filed together run on two Macs; at about one a week, rare.
# (`queue: max` would keep one shared queue, but actionlint 1.7.12 does not know
# the key yet, and a workflow GitHub rejects would silently never run.)
name: Recipe autofix

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: "A recipe-broken issue number"
        required: true

permissions:
  contents: read

jobs:
  select:
    # The sweep files its issues as the maintainer, with this label, and only
    # someone with triage access can set a label — so an issue anyone else opens
    # with the right marker in its body never gets past this line.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'jizhi0v0' &&
       contains(github.event.issue.labels.*.name, 'recipe-broken'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      recipe: ${{ steps.read.outputs.recipe }}
      issue: ${{ steps.read.outputs.issue }}
    steps:
      # Read through the API rather than the event, so a dispatch and an event
      # are judged the same way, and through environment variables only: the
      # issue's text never reaches a shell as code.
      #
      # The kind is looked for in the body and the sweep's own comments, not the
      # title: the title names only the first complaint, and a collapse on a
      # newest-last page comes with "went BACKWARDS" first. A reopen's current
      # failure is in its comment. `duo autofix` decides precisely; this only
      # keeps the Mac idle for everything else.
      - name: Read the recipe id off the issue
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "not an issue number: $ISSUE"; exit 1; }
          gh api "repos/$REPO/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          # `--slurp`: one array of pages whatever the gh version (older ones
          # printed one array per page, which is not one JSON document).
          gh api --paginate --slurp "repos/$REPO/issues/$ISSUE/comments" > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/comments.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          issue = json.load(open(sys.argv[1]))
          comments = [c for page in json.load(open(sys.argv[2])) for c in page]
          texts = [issue.get("body") or ""] + [
              c.get("body") or "" for c in comments if c["user"]["login"] == "jizhi0v0"]
          labels = {label["name"] for label in issue.get("labels", [])}
          # Reconcile writes this marker into every issue it files.
          marker = re.search(r"<!-- duo-verify-id: (changelog:[A-Za-z0-9._+<-]+(?::[A-Za-z0-9._+<-]+)*) -->",
                             issue.get("body") or "")
          kind = any("noEntriesExtracted" in t or "entry count COLLAPSED" in t for t in texts)
          ok = (issue["user"]["login"] == "jizhi0v0" and "recipe-broken" in labels
                and issue["state"] == "open" and "pull_request" not in issue and marker and kind)
          print(f"recipe={marker.group(1) if ok else ''}")
          print(f"issue={os.environ['ISSUE']}")
          print(f"in scope: {bool(ok)}", file=sys.stderr)
          PY

  propose:
    needs: select
    if: needs.select.outputs.recipe != ''
    runs-on: xcode-27
    # A cold build, the golden re-record, `make test` and `duo verify`.
    timeout-minutes: 150
    concurrency:
      group: recipe-autofix-issue-${{ needs.select.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.autofix.outputs.ready }}
      base: ${{ steps.autofix.outputs.base }}
    env:
      RECIPE: ${{ needs.select.outputs.recipe }}
      ISSUE: ${{ needs.select.outputs.issue }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # The worktree the gates build in is added at `origin/main`.
      - name: Fetch origin/main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version

      # Pinned and hash-checked (scripts/pinned-xcodegen.sh), not brew's current
      # formula: this job goes on to hold the model's token.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          xcodegen="$(scripts/pinned-xcodegen.sh)"
          dirname "$xcodegen" >> "$GITHUB_PATH"

      # Pinned: CLI/Sources/DuoKit/ClaudeCLI.swift was checked against this
      # version's flags, and the sandbox depends on every one of them.
      - name: Install Claude Code
        run: |
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.287
          claude --version

      - name: Build duo
        run: |
          swift build --package-path CLI
          echo "DUO=$(swift build --package-path CLI --show-bin-path)/duo" >> "$GITHUB_ENV"

      # A fresh reading of the one recipe, against a copy of the committed
      # baseline so the collapse check has its last good count. The copy takes
      # whatever this sweep writes; autofix reads the committed file.
      - name: Sweep the recipe
        run: |
          cp verify/baseline.json "$RUNNER_TEMP/sweep-baseline.json"
          "$DUO" verify --changelog --only "$RECIPE" --allow-stale-binary \
            --baseline "$RUNNER_TEMP/sweep-baseline.json" --report "$RUNNER_TEMP/report.json" \
            || echo "the sweep reported the recipe (expected)"

      - name: Propose and gate
        id: autofix
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # As ci.yml's hosted runs: the test that downloads real vendor builds
          # runs here, where egress is free.
          DUO_DOWNLOAD_GATE: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/autofix"
          # `--only` matches by substring (`…macos:-` also sweeps `…macos:-:1-2`);
          # `--recipe` holds autofix to this issue's recipe exactly.
          "$DUO" autofix --issue "$ISSUE" --recipe "$RECIPE" --report "$RUNNER_TEMP/report.json" \
            --baseline verify/baseline.json --worktree "$RUNNER_TEMP/tree" --out "$out"
          if [ -f "$out/pr.json" ]; then
            git -C "$RUNNER_TEMP/tree" add -A
            git -C "$RUNNER_TEMP/tree" diff --cached --binary > "$out/change.patch"
            echo "base=$(git -C "$RUNNER_TEMP/tree" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the change
        if: steps.autofix.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recipe-autofix
          path: ${{ runner.temp }}/autofix/
          retention-days: 7

  publish:
    needs: [select, propose]
    if: needs.propose.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN only labels the draft; the branch and the pull request are the
    # PR token's, so the draft's CI runs.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ needs.select.outputs.issue }}
      HAS_PR_TOKEN: ${{ secrets.RECIPE_AUTOFIX_PR_TOKEN != '' }}
    steps:
      - name: Stop without a token
        if: env.HAS_PR_TOKEN != 'true'
        run: echo "::warning::RECIPE_AUTOFIX_PR_TOKEN is not set; the change passed every gate but no draft was opened."

      - name: Check out the commit propose started from
        if: env.HAS_PR_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false

      - name: Download the change
        if: env.HAS_PR_TOKEN == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-autofix
          path: ${{ runner.temp }}/autofix

      # The same allowlist the harness's G5 enforces, again, in a job that ran
      # none of its code: one recipe family, its golden, the parser generation
      # and its pin, and the fixture — and the branch for this issue alone.
      - name: Apply and check the change
        if: env.HAS_PR_TOKEN == 'true'
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/autofix/change.patch"
          # --no-renames: a rename's source would otherwise not be listed at all.
          git diff --cached --no-renames --name-status > "$RUNNER_TEMP/changed.txt"
          python3 - "$RUNNER_TEMP/autofix/pr.json" "$RUNNER_TEMP/changed.txt" <<'PY'
          import json, os, re, sys
          plan = json.load(open(sys.argv[1]))
          entries = [line.split("\t") for line in open(sys.argv[2]).read().split("\n") if line]
          assert all(len(e) == 2 and e[0] in ("A", "M") for e in entries), entries
          changed = sorted(e[1] for e in entries)
          assert plan["branch"] == f"recipe-autofix/issue-{os.environ['ISSUE']}", plan["branch"]
          assert changed == sorted(plan["paths"]), (changed, plan["paths"])
          families = [m.group(1) for p in changed
                      if (m := re.fullmatch(r"DuoUpdaterCore/Sources/DuoUpdaterCore/Recipes/([A-Za-z0-9._-]+)\.swift", p))]
          assert len(families) == 1, families
          allowed = {
              f"DuoUpdaterCore/Sources/DuoUpdaterCore/Recipes/{families[0]}.swift",
              f"DuoUpdaterCore/Tests/RecipeGoldens/{families[0]}.txt",
              "DuoUpdaterCore/Sources/DuoUpdaterCore/Sources/Changelog.swift",
              "DuoUpdaterCore/Tests/DuoUpdaterCoreTests/ChangelogParserGenerationGuardTests.swift",
          }
          fixture = re.compile(r"DuoUpdaterCore/Tests/DuoUpdaterCoreTests/Fixtures/changelog-autofix/[A-Za-z0-9._-]+\.(txt|json)")
          stray = [p for p in changed if p not in allowed and not fixture.fullmatch(p)]
          assert not stray, stray
          print("paths ok:", changed)
          PY

      - name: Push the branch and open the draft
        id: open
        if: env.HAS_PR_TOKEN == 'true'
        env:
          PR_TOKEN: ${{ secrets.RECIPE_AUTOFIX_PR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/autofix/pr.json"
          branch="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["branch"])' "$plan")"
          title="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$plan")"
          body="$RUNNER_TEMP/autofix/body.md"
          printf '\n---\nGates run in %s.\n' "$RUN_URL" >> "$body"
          git -c user.name="duo-autofix" -c user.email="duo-autofix@users.noreply.github.com" \
            commit -q -m "$title" -m "Refs #$ISSUE"
          # Not forced: a branch already there means a draft already exists.
          git push -q "https://x-access-token:${PR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          url="$(GH_TOKEN="$PR_TOKEN" gh pr create --draft --base main --head "$branch" \
            --title "$title" --body-file "$body")"
          echo "opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh label create recipe-autofix --color FBCA04 \
            --description "Fix proposed by duo autofix" 2>/dev/null || true
          gh pr edit "$url" --add-label recipe-autofix

      # `duo autofix` decided whether the change may merge with no person looking
      # (every gate, a clean verify, and a second model's check of the page and
      # the entries). The variable is the switch: unset, an eligible change stays
      # a draft and its body says it would have merged.
      - name: Merge an eligible change
        if: env.HAS_PR_TOKEN == 'true'
        env:
          PR_TOKEN: ${{ secrets.RECIPE_AUTOFIX_PR_TOKEN }}
          AUTOMERGE: ${{ vars.RECIPE_AUTOFIX_AUTOMERGE }}
          URL: ${{ steps.open.outputs.url }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/autofix/pr.json"
          eligible="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["autoMerge"])' "$plan")"
          if [ "$eligible" != "True" ]; then
            echo "not eligible; a person decides (reasons in the pull request)"; exit 0
          fi
          if [ "$AUTOMERGE" != "1" ]; then
            echo "::notice::eligible, but RECIPE_AUTOFIX_AUTOMERGE is not 1: left as a draft"; exit 0
          fi
          # Two open changes to one family regenerate one golden each from a base
          # without the other; main's required check does not ask for a current
          # branch, so that pair could both merge green and leave main red.
          family="$(python3 -c 'import json,sys,re; print(next(p for p in json.load(open(sys.argv[1]))["paths"] if re.fullmatch(r"DuoUpdaterCore/Sources/DuoUpdaterCore/Recipes/[^/]+\.swift", p)))' "$plan")"
          self="${URL##*/}"
          others="$(GH_TOKEN="$PR_TOKEN" gh pr list --state open --limit 100 --json number,files \
            --jq "[.[] | select(.number != $self) | select(any(.files[]; .path == \"$family\" or .path == \"DuoUpdaterCore/Sources/DuoUpdaterCore/Sources/Changelog.swift\"))] | map(.number | tostring) | join(\" \")")"
          if [ -n "$others" ]; then
            echo "::notice::open pull requests touch the same files ($others): left as a draft"; exit 0
          fi
          GH_TOKEN="$PR_TOKEN" gh pr ready "$URL"
          GH_TOKEN="$PR_TOKEN" gh pr merge "$URL" --auto --squash
          echo "auto-merge enabled on $URL"

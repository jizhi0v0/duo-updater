# Build and test on a GitHub-hosted Mac.
#
# The last workflow this repository had was deleted the day it went public
# (4ff9a90, 2026-08-14) because it pointed at a self-hosted runner running as the
# desktop user, and a public repo eventually gets a pull_request trigger pointed at
# it. That reasoning still stands, so this one is built the other way round:
#
#   • GitHub-hosted runner only. Nothing here can reach a machine of ours.
#   • No secrets. `make test` needs none — both xcodebuild invocations already pass
#     CODE_SIGNING_ALLOWED=NO, and DUO_TEAM_ID has a default — so a fork's pull
#     request has nothing to exfiltrate even if it rewrites this file.
#   • `pull_request`, never `pull_request_target`. The latter runs the BASE
#     workflow with the repository's secrets available to a fork's code, which is
#     the standard way this goes wrong.
#   • Actions pinned by commit SHA, not by tag. A tag can be moved.
#
# Standard GitHub-hosted runners are free and unlimited on public repositories, and
# xcode-27 is an arm64 M1 — which matters here because DuoUpdater is arm64-only
# by product decision (App/project.yml, ARCHS: arm64), so this builds and tests
# natively rather than under emulation.
#
# There is no `macos-27` label: GitHub's only macOS 27 image is `xcode-27` (macOS 27
# + Xcode 27, same 3-core M1 tier as macos-latest). NOT `xcode-27-xlarge` — larger
# runners are billed even on public repositories.
#
# All events use GitHub-hosted runners. The mini is excluded because its
# disk space is insufficient for CI builds and persistent workspaces.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. The release path deliberately does not live in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify bench-only and pure nightly scan-state changes on Linux, so this
  # takes no macOS slots. `pull-requests: read` lists the pull request's files.
  # Bench-only changes skip the three macOS jobs; `test` below accepts that.
  # Pure nightly scan state uses a trusted classifier and Linux data validation
  # instead, including the protected-main push of the verified merged scan PR.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bench_only: ${{ steps.bench.outputs.bench_only }}
      nightly_only: ${{ steps.nightly.outputs.nightly_only }}
    steps:
      - name: Check out trusted nightly classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-nightly
          persist-credentials: false
          sparse-checkout: |
            scripts/check_nightly_data.py
            scripts/check_codex_review.py
          sparse-checkout-cone-mode: false

      - name: Only nightly scan state changed?
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -f trusted-nightly/scripts/check_nightly_data.py ]; then
            python3 trusted-nightly/scripts/check_nightly_data.py >> "$GITHUB_OUTPUT"
          else
            # The introducing PR must pass full CI before this policy exists
            # on the protected default branch.
            echo "nightly_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Not `paths-ignore`: a workflow skipped by a path filter leaves the
      # required `test` check pending, which blocks the merge. Pull requests
      # only. A verified nightly-state push uses the data path separately.
      - name: Only bench/ changed?
        id: bench
        if: steps.nightly.outputs.nightly_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            # The files endpoint lists at most 3000; with more, some went unseen.
            total=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .changed_files)
            if [ -n "$files" ] && [ "$(wc -l <<<"$files")" -eq "$total" ] &&
               ! grep -qv '^bench/' <<<"$files"; then only=true; fi
          fi
          echo "bench_only=$only" >> "$GITHUB_OUTPUT"
          echo "bench_only=$only"

  # `make test` in its three parts plus Core's Release pass, each on its own
  # runner. One after another they took 22–28 minutes, more than half of it one
  # compile: run 37190107638 spent 8 minutes in `make test` and 14 in the Release
  # step, 10.7 of those building the test target. Side by side the wall clock is
  # the longest job instead of the sum. Standard runners on a public repository
  # cost nothing either way; the price is up to three macOS runners per push.
  swift:
    needs: route
    if: needs.route.outputs.bench_only != 'true' && needs.route.outputs.nightly_only != 'true'
    runs-on: xcode-27
    # Core's suite reaches vendor endpoints (the install gates download real
    # packages and verify sha512 + Team ID), so it is slower and less predictable
    # than a pure unit run. Generous, but far under the 6h job ceiling.
    timeout-minutes: 45
    steps:
      # The xcode-27 image mounts its four Simulator runtimes (iOS, tvOS, watchOS,
      # visionOS 27.0) the first time anything asks for them, and the first
      # `swift test` does. Its watchOS cryptex mount fails and falls back to a
      # disk image, which `simdiskimaged` then fails to unmount every 2 s and
      # mounts again 45–70 s later. Core's disk-image tests running through that
      # window failed in 15 of 18 first runs (hdiutil "Resource busy", "no
      # mountable file systems", partitionDisk -69772 for 60 s): on main whenever
      # a warm cache left nothing to compile, 17 of 19 hosted jobs from
      # 2026-10-12 to 10-16, against 0 of 41 that compiled first. Mounted first
      # and the tests started at least 150 s later: 5 of 5 green (diag runs
      # 38924731153, 38925900761, 2026-10-16). First step, so checkout and the
      # cache restore count toward the 150 s; the compile is in the same step as
      # the tests and cannot.
      - name: Mount the Simulator runtimes now
        run: |
          xcrun simctl list runtimes
          echo "SIM_RUNTIMES_MOUNTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      # A GitHub-hosted runner starts with no build at all, so it compiles the
      # whole package every run. SwiftPM's build is cached between hosted runs;
      # scripts/ci_build_cache.py says why the directory alone would not be warm.
      # Restored on every hosted run (a pull request reads main's), saved only by
      # a push to main or a dispatch, so a pull request cannot write what main
      # reads. The key names the toolchain (Xcode and Swift): another
      # toolchain's build is not reusable.
      #
      # Measured on 2026-10-12 (runs 38281525757, 38283220484, 38283958913):
      # this job took 9.2 min cold (365 s of it compiling Core), 4.9 with no
      # Swift change since the cache (32 s), 6.3 after an edit to one Core
      # source and one test file (128 s). Restoring ~300 MB took 14–17 s, and
      # saving it 15–21 s.
      - name: Name SwiftPM's build cache
        id: spm-key
        run: echo "key=spm-${{ github.job }}-$({ xcodebuild -version; swift --version; } 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM's build
        id: spm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.spm-key.outputs.key }}-

      - name: Put back the cached build's file times
        if: steps.spm-cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci_build_cache.py restore DuoUpdaterCore/.build

      - name: Let the Simulator runtime mounts settle
        run: |
          left=$(( SIM_RUNTIMES_MOUNTED_AT + 150 - $(date +%s) ))
          echo "waiting ${left}s"
          if [ "$left" -gt 0 ]; then sleep "$left"; fi

      # Then `simdiskimaged` goes, for the rest of the job: nothing here runs a
      # Simulator, and it ejects disk images Core's tests have just attached. It
      # unmounts its watchOS runtime disk by BSD name and retries; once that disk
      # is gone, a test image attached a moment later gets the freed number, and
      # the retry unmounts and ejects the test's image instead. Seen twice in
      # the unified log on this runner (macOS 27.0.1, diag run 39156823747,
      # 2026-10-18): `simdiskimaged` writes `/dev/disk9` and asks storagekitd to
      # unmount it, "hfs: unmount initiated on ZZFixture on device disk9s2",
      # then an eject — 0.1 s and 6 s after a test's image took disk9 from the
      # watchOS runtime. To the test, `attach` succeeded and the volume then
      # vanished: `noAppFound`, or "not listed as attached". Booted out after
      # the mounts above (the runtimes stay mounted), in diag run 39162841326:
      # 0 failed of 30 full Release suites and no such write, against 2 failed
      # of 30 (both a runner's first suite) and 8 such writes in 5 suites with
      # it left running; on main's own code (diag run 39168640317), a runner's
      # first suite failed 4 of 12 times with it running (one a 17-minute hang
      # in `hdiutil attach`) and 0 of 12 with it stopped.
      - name: Stop simdiskimaged
        run: |
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sleep 2
          if pgrep -lf simdiskimaged; then echo "::warning::simdiskimaged is still running"; fi

      - name: make test-swift
        # DUO_DOWNLOAD_GATE moves the one test that fetches real vendor builds off
        # a metered connection onto this runner, where egress is free. Measured on
        # the author's Mac: `make test` goes from ~185 MB to ~25 MB.
        #
        # It was switched on once before and wedged three runs out of three — the
        # test process stopped emitting entirely, for 46 and 16 minutes, until a
        # watchdog caught the third at four. `sample(1)` found all three
        # cooperative-pool threads (this runner is 3-core, so that is the whole
        # pool) blocked in `SecStaticCodeCheckValidity` -> `Dispatch::Group::wait()`,
        # and two samples a minute apart showed 0.01s of CPU between them: blocked,
        # not slow. #351. The gates now run off that pool, which is what makes this
        # safe to turn on.
        #
        # If it wedges again, `scripts/run-with-hang-report.sh` bounds it at 30
        # minutes and prints the stacks rather than leaving another silent hour.
        # Through the wrapper, so a wedge costs 30 minutes and a set of thread
        # stacks instead of 60 minutes of silence. Measured: three runs on this
        # branch wedged, one of them for the full job budget with no output at
        # all. See #351 and scripts/run-with-hang-report.sh for why this is out
        # here and not a watchdog inside the test process.
        #
        # On a hosted runner, through scripts/run-unclamped.sh too: the runner
        # clamps every process it starts to utility QoS, and under that clamp the
        # tests' children wait minutes in the kernel's low-priority I/O throttle.
        # That was the 120–165 s tail of this step (the script has the numbers).
        # Outside the hang wrapper, so the wrapper still finds the test process
        # among its own descendants.
        env:
          DUO_DOWNLOAD_GATE: '1'
        run: scripts/run-unclamped.sh scripts/run-with-hang-report.sh 1800 make test-swift

      # After a failed test too: the build itself is sound, and main's failures
      # are mostly tests. Not after a cancel, which can stop a build halfway.
      - name: Record the build's file times
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci_build_cache.py stamp DuoUpdaterCore/.build

      - name: Save SwiftPM's build
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-${{ github.sha }}

  app:
    needs: route
    if: needs.route.outputs.bench_only != 'true' && needs.route.outputs.nightly_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      # App/DuoUpdater.xcodeproj is gitignored — the spec in App/project.yml is the
      # source of truth and scripts/app-tests.sh regenerates it when missing.
      # Pinned and hash-checked (scripts/pinned-xcodegen.sh) rather than brew's
      # current formula, for the same one definition of "which XcodeGen" the
      # signing scripts use.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          xcodegen="$(scripts/pinned-xcodegen.sh)"
          dirname "$xcodegen" >> "$GITHUB_PATH"

      # Tests and shipping builds share dependency downloads and DerivedData,
      # with distinct Debug/Release products. Localization's emit-strings build
      # stays separate so its settings and .stringsdata cannot mix with tests;
      # its Sparkle embed also requires artifacts under its own DerivedData.
      - name: Name Xcode's build cache
        id: xcode-key
        run: |
          python3 scripts/ci_xcode_cache.py >> "$GITHUB_OUTPUT"
          dd="$(python3 scripts/derived_data_path.py ci-xcode "$PWD")"
          loc="$(python3 scripts/derived_data_path.py ci-localizable "$PWD")"
          echo "dd=$dd" >> "$GITHUB_OUTPUT"
          echo "loc=$loc" >> "$GITHUB_OUTPUT"
          echo "APP_TESTS_DD=$dd" >> "$GITHUB_ENV"
          echo "UNSIGNED_RELEASE_DD=$dd" >> "$GITHUB_ENV"
          echo "LOCALIZABLE_DD=$loc" >> "$GITHUB_ENV"
          echo "XCODE_CLONED_SOURCE_PACKAGES=$dd/SourcePackages" >> "$GITHUB_ENV"
          echo "XCODE_MODULE_CACHE_PATH=$dd/ModuleCache.noindex" >> "$GITHUB_ENV"

      - name: Generate Xcode project with committed pins
        env:
          DUO_TEAM_ID: RS59HDH7Y3
        run: |
          xcodegen generate --spec App/project.yml --project App
          pins=App/DuoUpdater.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$pins"
          cp App/Package.resolved "$pins/Package.resolved"
          echo "XCODE_PROJECT_PREGENERATED=1" >> "$GITHUB_ENV"

      # Keep only reusable build data: no test reports, logs, index stores or
      # SDK stat caches from the old VM. PRs read but never publish these caches.
      - name: Restore Xcode's build
        id: xcode-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.xcode-key.outputs.dd }}/Build
            ${{ steps.xcode-key.outputs.dd }}/ModuleCache.noindex
            ${{ steps.xcode-key.outputs.dd }}/SourcePackages
            ${{ steps.xcode-key.outputs.dd }}/ci-mtimes.json
            ${{ steps.xcode-key.outputs.loc }}/Build
            ${{ steps.xcode-key.outputs.loc }}/SourcePackages
          key: ${{ steps.xcode-key.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.xcode-key.outputs.key }}-

      - name: Put back the cached Xcode build's source times
        if: steps.xcode-cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci_build_cache.py restore "$APP_TESTS_DD"

      - name: make test-scripts
        run: make test-scripts

      - name: make test-app
        run: scripts/run-with-hang-report.sh 1200 make test-app

      # The App tests and localization extraction compile Debug. Core's Release
      # job does not compile the shipping App or CLI schemes, so require both
      # unsigned Release builds before this job (and the required `test`) passes.
      - name: App and CLI unsigned Release builds
        timeout-minutes: 20
        run: make test-release-build

      - name: Record the Xcode build's source times
        if: github.event_name != 'pull_request' && steps.xcode-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci_build_cache.py stamp "$APP_TESTS_DD"

      - name: Save Xcode's build
        if: github.event_name != 'pull_request' && steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.xcode-key.outputs.dd }}/Build
            ${{ steps.xcode-key.outputs.dd }}/ModuleCache.noindex
            ${{ steps.xcode-key.outputs.dd }}/SourcePackages
            ${{ steps.xcode-key.outputs.dd }}/ci-mtimes.json
            ${{ steps.xcode-key.outputs.loc }}/Build
            ${{ steps.xcode-key.outputs.loc }}/SourcePackages
          key: ${{ steps.xcode-key.outputs.key }}-${{ github.sha }}

      # scripts/app-tests.sh prints only an excerpt and leaves the full xcodebuild
      # output in the derived-data dir, which dies with the runner. Two first
      # attempts on 2026-09-16 failed there and could not be diagnosed after the
      # retry went green: the name-set gate reporting one case never ran (run
      # 35084900798), and `Could not resolve package dependencies:` with its
      # reasons only in that file (run 35085768264).
      #
      # The dir is this job's APP_TESTS_DD (set above) and the log is per process
      # (app-tests-<pid>.log), so only this run's files match. The rest of that
      # dir is build products and caches (~500 MB on a local Mac, 2026-09-16).
      #
      # Not the .xcresult itself: on a failed run it embeds a system .logarchive,
      # and uploading the bundle as-is made a 107 MB artifact (run 35087278533,
      # two 184 MB dyld-cache text files in it). What is worth keeping from it is
      # extracted below: the per-case results, which answer "did that case run"
      # without going through the console log the gate parses, and xctest's own
      # session logs.
      #
      # Bounded because it runs before the upload: after a wedge the bundle may be
      # half-written, and if reading it stalled into the job's 60-minute limit
      # the upload would depend on how `failure()` evaluates after a job timeout,
      # which GitHub's expression docs don't define (third-party reports say the
      # job ends cancelled, which would skip it). Not measured here.
      - name: Extract app-tests result bundle
        if: failure()
        timeout-minutes: 5
        run: |
          shopt -s nullglob
          for bundle in "$APP_TESTS_DD"/app-tests-*.xcresult; do
            out="$(dirname "$bundle")/ci-xcresult/$(basename "$bundle" .xcresult)"
            mkdir -p "$out"
            xcrun xcresulttool get test-results tests --path "$bundle" > "$out/tests.json" \
              || echo "::warning::xcresulttool could not read test results from $bundle"
            xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$out/diagnostics" >/dev/null \
              || echo "::warning::xcresulttool could not export diagnostics from $bundle"
            find "$out/diagnostics" -name '*.logarchive' -prune -exec rm -rf {} + 2>/dev/null || true
          done

      # `failure()` also fires when something other than the app tests failed;
      # then nothing matches and this only warns. Artifact names must be unique
      # within a run; the attempt number keeps a failing re-run from depending on
      # whether an earlier attempt's artifact counts against that.
      - name: Upload app-tests logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-tests-logs-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.APP_TESTS_DD }}/app-tests-*.log
            ${{ env.APP_TESTS_DD }}/ci-xcresult/
            ${{ env.APP_TESTS_DD }}/Logs/Package/*.xcactivitylog

  release:
    needs: route
    if: needs.route.outputs.bench_only != 'true' && needs.route.outputs.nightly_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      # Same as `swift` (see there): the Simulator runtimes mount now, not under
      # the disk-image tests.
      - name: Mount the Simulator runtimes now
        run: |
          xcrun simctl list runtimes
          echo "SIM_RUNTIMES_MOUNTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      # Cached on hosted runners the same way as `swift` (see there). The gain
      # here depends on the change: the library is one whole-module -O compile,
      # and any edit under Sources/ rebuilds it and the whole test target after
      # it. Measured on 2026-10-12 (same runs as `swift`): 14.2 min cold (685 s
      # compiling), 2.9 with no Swift change since the cache (1 s), 12.2 after
      # an edit to one Core source and one test file (556 s).
      - name: Name SwiftPM's build cache
        id: spm-key
        run: echo "key=spm-${{ github.job }}-$({ xcodebuild -version; swift --version; } 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM's build
        id: spm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.spm-key.outputs.key }}-

      - name: Put back the cached build's file times
        if: steps.spm-cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci_build_cache.py restore DuoUpdaterCore/.build

      - name: Let the Simulator runtime mounts settle
        run: |
          left=$(( SIM_RUNTIMES_MOUNTED_AT + 150 - $(date +%s) ))
          echo "waiting ${left}s"
          if [ "$left" -gt 0 ]; then sleep "$left"; fi

      # Same as `swift` (see there): `simdiskimaged` ejects test images.
      - name: Stop simdiskimaged
        run: |
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sleep 2
          if pgrep -lf simdiskimaged; then echo "::warning::simdiskimaged is still running"; fi

      # Core's tests once more, optimized — the configuration the app ships in.
      # `make test` builds them in debug only, and on 2026-10-02 that let a
      # crash through: Junie's release-notes task group returned nothing and
      # aborted the app in Release (`__cxa_pure_virtual` in
      # `AsyncTask::completeFuture`) while every debug test passed. The same
      # JunieChangelogTests, built `-c release` against the broken code, die on
      # signal 6. ~30 s on the author's Mac once built; through the wrapper for
      # the same reason as `make test`.
      #
      # Only the library is optimized: the test target builds -Onone in batch
      # mode even under `-c release`, which needs the native build system —
      # hence `make test-release` rather than a bare `swift test -c release`
      # (DuoUpdaterCore/Package.swift says why). Checked on 2026-10-04 that the
      # Junie abort still reproduces that way.
      # Unclamped on a hosted runner, as in the swift job's `make test-swift`.
      - name: Core tests (Release)
        run: scripts/run-unclamped.sh scripts/run-with-hang-report.sh 1200 make test-release

      # After a failed test too: the build itself is sound, and main's failures
      # are mostly tests. Not after a cancel, which can stop a build halfway.
      - name: Record the build's file times
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci_build_cache.py stamp DuoUpdaterCore/.build

      - name: Save SwiftPM's build
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-${{ github.sha }}

  # LINT.IfChange / LINT.ThenChange links (scripts/check_ifchange.py): a pull
  # request that changes one side of a link must change the other, or say why
  # with NO_IFTTT=<reason>. `make test-scripts` checks the markers on every run;
  # only this job has the pull request's diff. Two commits deep because the
  # checkout is the merge commit and its first parent is the base it is diffed
  # against. Runs on every event so `test` below never sees it skipped. Linux,
  # so it takes none of the five macOS slots.
  ifchange:
    needs: route
    if: needs.route.outputs.nightly_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Linked changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 scripts/check_ifchange.py --base HEAD^1
          else
            python3 scripts/check_ifchange.py
          fi

  nightly-data:
    needs: route
    if: needs.route.outputs.nightly_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted data validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check_nightly_data.py
            scripts/check_codex_review.py
          sparse-checkout-cone-mode: false
      - name: Validate pinned scan data
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_nightly_data.py --validate

  # The one CI check the `main` ruleset requires is named `test`, which was this
  # workflow's only job. Rather than editing the ruleset, `test` is now the gate
  # over the jobs above. `always()`, not `!cancelled()`: a required check that is
  # SKIPPED counts as passing, so this must run — and fail — whenever any of
  # them failed, was cancelled or did not run. One exception is a pull
  # request that only touches `bench/` (see `route`): there the three macOS
  # jobs are skipped on purpose, and only `route` and `ifchange` must pass.
  # Pure nightly scan state instead requires route + nightly-data; only its
  # four unrelated jobs may be skipped. Missing/failed validation never passes.
  test:
    needs: [route, swift, app, release, ifchange, nightly-data]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out CI result gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check_ci_results.py
          sparse-checkout-cone-mode: false
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          BENCH_ONLY: ${{ needs.route.outputs.bench_only }}
          NIGHTLY_ONLY: ${{ needs.route.outputs.nightly_only }}
        run: python3 scripts/check_ci_results.py

name: diag-early-boot-disk-images
on:
  push:
    branches: [diag/early-boot-disk-images]
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        arm: [warmup]
        rep: [1, 2, 3, 4]
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Uptime at job start
        run: echo "uptime=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"; uptime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name SwiftPM's build cache
        id: spm-key
        run: echo "key=spm-release-$({ xcodebuild -version; swift --version; } 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM's build
        id: spm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: DuoUpdaterCore/.build
          key: ${{ steps.spm-key.outputs.key }}-none
          restore-keys: ${{ steps.spm-key.outputs.key }}-
      - name: Put back the cached build's file times
        if: steps.spm-cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci_build_cache.py restore DuoUpdaterCore/.build
      - name: Force a Core rebuild (recompile arm)
        if: matrix.arm == 'recompile'
        run: echo "// diag $(date +%s)" >> DuoUpdaterCore/Sources/DuoUpdaterCore/Install/DiskImageMount.swift
      - name: Disk-image suites once (warm-up)
        run: |
          set +e
          time swift test --package-path DuoUpdaterCore -c release --build-system native --filter 'DiskImageMountDetachTests|InstallChildProcessTests|BackupDestinationProbeTests|TestDiskImagesTests' 2>&1 | grep -E '✘ Test .*recorded|Test run with'
          true
      - name: Core tests (Release)
        run: |
          set +e
          echo "uptime at test start=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"
          ( while true; do echo "--- $(date -u +%H:%M:%S)"; top -l 2 -n 5 -o cpu -stats pid,command,cpu | tail -6; sleep 20; done ) > "$RUNNER_TEMP/cpu.log" 2>&1 &
          log stream --style compact --level info --predicate 'process CONTAINS[c] "diskimage" OR subsystem CONTAINS[c] "diskimage" OR process == "storagekitd"' > "$RUNNER_TEMP/di.log" 2>&1 &
          LS=$!
          scripts/run-with-hang-report.sh 1200 make test-release
          echo "rc=$?"
          sleep 5; kill $LS
          echo "== probe failures"; grep -h ' rc=[1-9]' "$RUNNER_TEMP"/probe-*.log
          echo "== probe totals: ok=$(cat "$RUNNER_TEMP"/probe-*.log | grep -c ' rc=0') fail=$(cat "$RUNNER_TEMP"/probe-*.log | grep -c ' rc=[1-9]')"
          echo "== readonly"; cat "$RUNNER_TEMP/readonly.log" 2>/dev/null | head -80
          echo "== di.log lines $(wc -l < "$RUNNER_TEMP/di.log")"; grep -i -E 'read-?only|busy|error|fail' "$RUNNER_TEMP/di.log" | cut -c1-300 | head -60
          echo "uptime at test end=$(( $(date +%s) - $(sysctl -n kern.boottime | awk '{print $4}' | tr -d ,) ))s"
      - name: CPU
        if: always()
        run: cat "$RUNNER_TEMP/cpu.log" | head -120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.arm }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/di.log
            ${{ runner.temp }}/probe-*.log
            ${{ runner.temp }}/readonly.log

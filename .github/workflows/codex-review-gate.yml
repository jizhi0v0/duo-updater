# A clean review of the CURRENT head is required in addition to compilation.
# Runs trusted default-branch code on a hosted Linux runner. The only write scope
# publishes a check on the PR head; no PR code, model or secret is executed.
name: Codex review gate
run-name: 'Codex review gate PR #${{ github.event.pull_request.number }} @${{ github.event.pull_request.head.sha }}'

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted default-branch review gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/check_codex_review.py
          sparse-checkout-cone-mode: false
      - name: Wait for a clean Codex review of this head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/check_codex_review.py --pr "$PR" --head "$HEAD_SHA" --publish-check --run-url "$RUN_URL"

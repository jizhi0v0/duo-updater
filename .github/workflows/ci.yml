# Build and test on a GitHub-hosted Mac.
#
# The last workflow this repository had was deleted the day it went public
# (4ff9a90, 2026-08-14) because it pointed at a self-hosted runner running as the
# desktop user, and a public repo eventually gets a pull_request trigger pointed at
# it. That reasoning still stands, so this one is built the other way round:
#
#   • GitHub-hosted runner only. Nothing here can reach a machine of ours.
#   • No secrets. `make test` needs none — both xcodebuild invocations already pass
#     CODE_SIGNING_ALLOWED=NO, and DUO_TEAM_ID has a default — so a fork's pull
#     request has nothing to exfiltrate even if it rewrites this file.
#   • `pull_request`, never `pull_request_target`. The latter runs the BASE
#     workflow with the repository's secrets available to a fork's code, which is
#     the standard way this goes wrong.
#   • Actions pinned by commit SHA, not by tag. A tag can be moved.
#
# Standard GitHub-hosted runners are free and unlimited on public repositories, and
# xcode-27 is an arm64 M1 — which matters here because DuoUpdater is arm64-only
# by product decision (App/project.yml, ARCHS: arm64), so this builds and tests
# natively rather than under emulation.
#
# There is no `macos-27` label: GitHub's only macOS 27 image is `xcode-27` (macOS 27
# + Xcode 27, same 3-core M1 tier as macos-latest). NOT `xcode-27-xlarge` — larger
# runners are billed even on public repositories.
#
# Except: a pull request from a branch of THIS repository runs on the mini
# (self-hosted, label `duo-mini`). The free tier runs at most five macOS jobs at
# once and every push here takes three, so two pull requests pushed together
# queued — up to 12 minutes, 282 minutes in total over 60 runs from 2026-10-01.
# What makes a self-hosted runner acceptable on a public repository now, when it
# was not on 2026-08-14, is the repository settings, not this file: pull request
# creation is limited to collaborators, and a fork's workflow waits for approval
# whoever sent it (`all_external_contributors`). A fork's pull request runs the
# fork's copy of this file, so the condition below cannot keep it off the mini by
# itself; it keeps an approved fork PR on a hosted runner as long as the file is
# ours. Pushes to main, the public record that main is green, stay hosted — and
# with them the 3-core runner, the only place #351's pool starvation reproduced.
# If the mini is down, dispatch this workflow on the branch: dispatch is hosted.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. The release path deliberately does not live in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make test` in its three parts plus Core's Release pass, each on its own
  # runner. One after another they took 22–28 minutes, more than half of it one
  # compile: run 37190107638 spent 8 minutes in `make test` and 14 in the Release
  # step, 10.7 of those building the test target. Side by side the wall clock is
  # the longest job instead of the sum. Standard runners on a public repository
  # cost nothing either way; the price is up to three macOS runners per push.
  swift:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","duo-mini"]') || 'xcode-27' }}
    # Core's suite reaches vendor endpoints (the install gates download real
    # packages and verify sha512 + Team ID), so it is slower and less predictable
    # than a pure unit run. Generous, but far under the 6h job ceiling.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # The mini keeps its workspace between runs. Checkout's own clean is
      # `git clean -ffdx`, which takes SwiftPM's .build with it: test-swift then
      # compiled from nothing every run, 187 s on the mini against 45–59 s warm.
      # Everything else untracked still goes — a gitignored App/DuoUpdater.xcodeproj
      # left by another branch breaks `make test` on missing files.
      - name: Reset the workspace, keeping SwiftPM's build
        if: runner.environment == 'self-hosted'
        run: git reset --hard HEAD && git clean -ffdx -e DuoUpdaterCore/.build

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      - name: make test-swift
        # DUO_DOWNLOAD_GATE moves the one test that fetches real vendor builds off
        # a metered connection onto this runner, where egress is free. Measured on
        # the author's Mac: `make test` goes from ~185 MB to ~25 MB.
        #
        # It was switched on once before and wedged three runs out of three — the
        # test process stopped emitting entirely, for 46 and 16 minutes, until a
        # watchdog caught the third at four. `sample(1)` found all three
        # cooperative-pool threads (this runner is 3-core, so that is the whole
        # pool) blocked in `SecStaticCodeCheckValidity` -> `Dispatch::Group::wait()`,
        # and two samples a minute apart showed 0.01s of CPU between them: blocked,
        # not slow. #351. The gates now run off that pool, which is what makes this
        # safe to turn on.
        #
        # If it wedges again, `scripts/run-with-hang-report.sh` bounds it at 30
        # minutes and prints the stacks rather than leaving another silent hour.
        # Through the wrapper, so a wedge costs 30 minutes and a set of thread
        # stacks instead of 60 minutes of silence. Measured: three runs on this
        # branch wedged, one of them for the full job budget with no output at
        # all. See #351 and scripts/run-with-hang-report.sh for why this is out
        # here and not a watchdog inside the test process.
        #
        # Hosted only: on the mini that connection is metered again, and the test
        # itself says SKIPPED when the variable is unset. Same for the Makefile's
        # CORE_TEST_FLAGS (says why there): set only where it is not hosted.
        env:
          DUO_DOWNLOAD_GATE: ${{ runner.environment == 'github-hosted' && '1' || '' }}
          CORE_TEST_FLAGS: ${{ runner.environment == 'github-hosted' && '' || '--skip installPipelineDryRun' }}
        run: scripts/run-with-hang-report.sh 1800 make test-swift

  app:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","duo-mini"]') || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # The mini keeps its workspace between runs. Checkout's own clean is
      # `git clean -ffdx`, which takes SwiftPM's .build with it: test-swift then
      # compiled from nothing every run, 187 s on the mini against 45–59 s warm.
      # Everything else untracked still goes — a gitignored App/DuoUpdater.xcodeproj
      # left by another branch breaks `make test` on missing files.
      - name: Reset the workspace, keeping SwiftPM's build
        if: runner.environment == 'self-hosted'
        run: git reset --hard HEAD && git clean -ffdx -e DuoUpdaterCore/.build

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      # App/DuoUpdater.xcodeproj is gitignored — the spec in App/project.yml is the
      # source of truth and scripts/app-tests.sh regenerates it when missing.
      # The mini has it already, and `brew install` there would auto-update brew.
      - name: Install XcodeGen
        if: runner.environment == 'github-hosted'
        run: brew install xcodegen

      - name: make test-scripts
        run: make test-scripts

      - name: make test-app
        run: scripts/run-with-hang-report.sh 1200 make test-app

      # scripts/app-tests.sh prints only an excerpt and leaves the full xcodebuild
      # output in the derived-data dir, which dies with the runner. Two first
      # attempts on 2026-09-16 failed there and could not be diagnosed after the
      # retry went green: the name-set gate reporting one case never ran (run
      # 35084900798), and `Could not resolve package dependencies:` with its
      # reasons only in that file (run 35085768264).
      #
      # Globbed because the dir is per checkout (/tmp/duo-app-tests-<hash8>) and
      # the log per process (app-tests-<pid>.log). Each hosted job gets a fresh
      # VM, so only this job's dir can match. The rest of that dir is build
      # products and caches (~500 MB on a local Mac, 2026-09-16).
      #
      # Not the .xcresult itself: on a failed run it embeds a system .logarchive,
      # and uploading the bundle as-is made a 107 MB artifact (run 35087278533,
      # two 184 MB dyld-cache text files in it). What is worth keeping from it is
      # extracted below: the per-case results, which answer "did that case run"
      # without going through the console log the gate parses, and xctest's own
      # session logs.
      #
      # Bounded because it runs before the upload: after a wedge the bundle may be
      # half-written, and if reading it stalled into the job's 60-minute limit
      # the upload would depend on how `failure()` evaluates after a job timeout,
      # which GitHub's expression docs don't define (third-party reports say the
      # job ends cancelled, which would skip it). Not measured here.
      - name: Extract app-tests result bundle
        if: failure()
        timeout-minutes: 5
        run: |
          shopt -s nullglob
          for bundle in /tmp/duo-app-tests-*/app-tests-*.xcresult; do
            out="$(dirname "$bundle")/ci-xcresult/$(basename "$bundle" .xcresult)"
            mkdir -p "$out"
            xcrun xcresulttool get test-results tests --path "$bundle" > "$out/tests.json" \
              || echo "::warning::xcresulttool could not read test results from $bundle"
            xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$out/diagnostics" >/dev/null \
              || echo "::warning::xcresulttool could not export diagnostics from $bundle"
            find "$out/diagnostics" -name '*.logarchive' -prune -exec rm -rf {} + 2>/dev/null || true
          done

      # `failure()` also fires when something other than the app tests failed;
      # then nothing matches and this only warns. Artifact names must be unique
      # within a run; the attempt number keeps a failing re-run from depending on
      # whether an earlier attempt's artifact counts against that.
      - name: Upload app-tests logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-tests-logs-attempt-${{ github.run_attempt }}
          path: |
            /tmp/duo-app-tests-*/app-tests-*.log
            /tmp/duo-app-tests-*/ci-xcresult/
            /tmp/duo-app-tests-*/Logs/Package/*.xcactivitylog

  release:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","duo-mini"]') || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # The mini keeps its workspace between runs. Checkout's own clean is
      # `git clean -ffdx`, which takes SwiftPM's .build with it: test-swift then
      # compiled from nothing every run, 187 s on the mini against 45–59 s warm.
      # Everything else untracked still goes — a gitignored App/DuoUpdater.xcodeproj
      # left by another branch breaks `make test` on missing files.
      - name: Reset the workspace, keeping SwiftPM's build
        if: runner.environment == 'self-hosted'
        run: git reset --hard HEAD && git clean -ffdx -e DuoUpdaterCore/.build

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "arch: $(uname -m)"

      # Core's tests once more, optimized — the configuration the app ships in.
      # `make test` builds them in debug only, and on 2026-10-02 that let a
      # crash through: Junie's release-notes task group returned nothing and
      # aborted the app in Release (`__cxa_pure_virtual` in
      # `AsyncTask::completeFuture`) while every debug test passed. The same
      # JunieChangelogTests, built `-c release` against the broken code, die on
      # signal 6. ~30 s on the author's Mac once built; through the wrapper for
      # the same reason as `make test`.
      #
      # Only the library is optimized: the test target builds -Onone in batch
      # mode even under `-c release`, which needs the native build system —
      # hence `make test-release` rather than a bare `swift test -c release`
      # (DuoUpdaterCore/Package.swift says why). Checked on 2026-10-04 that the
      # Junie abort still reproduces that way.
      - name: Core tests (Release)
        env:
          CORE_TEST_FLAGS: ${{ runner.environment == 'github-hosted' && '' || '--skip installPipelineDryRun' }}
        run: scripts/run-with-hang-report.sh 1200 make test-release

  # The one check the `main` ruleset requires is named `test`, which was this
  # workflow's only job. Rather than editing the ruleset, `test` is now the gate
  # over the jobs above. `always()`, not `!cancelled()`: a required check that is
  # SKIPPED counts as passing, so this must run — and fail — whenever any of
  # them failed, was cancelled or did not run.
  test:
    needs: [swift, app, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "swift / app / release: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
